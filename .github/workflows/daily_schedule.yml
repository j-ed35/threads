name: Daily NBA Schedule

# Scheduled workflows only run from the default branch (main).
on:
  schedule:
    # 16:15 UTC = 12:15 PM EDT / 11:15 AM EST
    - cron: '15 16 * * *'

  # Allows manual trigger from Actions tab
  workflow_dispatch:

jobs:
  post-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Post NBA threads to #daily-threads
        env:
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
          NBA_STANDINGS_KEY: ${{ secrets.NBA_STANDINGS_KEY }}
          QUERY_TOOL_API_KEY: ${{ secrets.QUERY_TOOL_API_KEY }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_NBA_DAILY_THREADS: ${{ secrets.SLACK_CHANNEL_ID_NBA_DAILY_THREADS }}
        run: uv run python main.py --daily_threads
