name: Daily NBA Schedule

# Triggered daily at 12:30 PM ET by a cron-job.org job ("threads daily
# dispatch") that POSTs to the workflow_dispatch API. GitHub's own `schedule`
# trigger was removed because it routinely ran hours late.
# Can also be run by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  post-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Post NBA threads to #daily-threads
        env:
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
          NBA_STANDINGS_KEY: ${{ secrets.NBA_STANDINGS_KEY }}
          QUERY_TOOL_API_KEY: ${{ secrets.QUERY_TOOL_API_KEY }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_NBA_DAILY_THREADS: ${{ secrets.SLACK_CHANNEL_ID_NBA_DAILY_THREADS }}
        run: uv run python main.py --daily_threads
